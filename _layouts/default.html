<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page.title }} | {{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
  <header class="site-header">
    <div class="wrapper">
      <a class="site-title" href="{{ '/' | relative_url }}">✈ Caribbean April 2026</a>
      <nav class="site-nav">
        <a href="{{ '/' | relative_url }}">All Destinations</a>
      </nav>
    </div>
  </header>

  <main class="page-content">
    <div class="wrapper">
      {{ content }}
    </div>
  </main>

  <footer class="site-footer">
    <div class="wrapper">
      <p>Prices are estimates based on research conducted in March 2026. Verify before booking.
      Air Canada routes are subject to schedule changes — confirm at
      <a href="https://www.aircanada.com">aircanada.com</a>.</p>
    </div>
  </footer>
</body>
</html>
